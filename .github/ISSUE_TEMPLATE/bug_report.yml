name: Bug report
description: Report a display problem, a broken interaction or a problem in the documentation.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        Please do not report security vulnerabilities here: follow the [security policy](https://github.com/BnRomain/blockrose-equipment-rental/security/policy) instead.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - "Layout and styles (css/)"
        - "Interactions (js/)"
        - "Content and structure (pages/)"
        - "Brand book compliance (typefaces, palette, illustrations)"
        - "Images (images/)"
        - "CI / GitHub Actions"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The page, the section and the actions that trigger the problem.
      placeholder: |
        1. Open https://bnromain.github.io/blockrose-equipment-rental/pages/materiel.html on a phone
        2. Tap a product card
        3. ...
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or console output
      description: Drag and drop screenshots here, or paste the messages of the browser console.

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Device, operating system and browser with its version.
      placeholder: "iPhone 15, iOS 18, Safari"
    validations:
      required: true
